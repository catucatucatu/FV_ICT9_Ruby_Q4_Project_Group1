<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

.form-container {
    width: 850px; 
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

body {
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
}

.bg {
    position: fixed;
    top: 0;
    left: 220px;
    width: calc(100% - 220px);
    height: 100%;
    background: url('https://upload.wikimedia.org/wikipedia/commons/7/7b/400_Year_old_Beauty.jpg') no-repeat center/cover;
    filter: blur(6px);
    transform: scale(1.05);
    z-index: -1;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 220px;
    height: 100%;
    background: #000;
    color: #f4c300;
    padding-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.sidebar h2 {
    margin-bottom: 15px;
    color: #f4c300;
    text-align: center;
    width: 100%;
}

.sidebar img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #f4c300;
    margin-bottom: 15px;
}

.sidebar a {
    width: 100%;
    display: block;
    color: white;
    text-decoration: none;
    padding: 14px 20px;
    transition: 0.2s;
    text-align: center;
    font-size: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
}

.sidebar a:last-child {
    border-bottom: none;
}

.sidebar a:hover {
    background: #f4c300;
    color: black;
}

.main {
    margin-left: 220px;
    padding: 30px;
    min-height: 100vh;
}

.title {
    color: #fff;
    margin-bottom: 25px;
    font-size: 26px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.card {
    background: rgba(255,255,255,0.92);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    transition: 0.3s;
    cursor: pointer;
    min-height: 240px;
}

.card:hover {
    transform: translateY(-6px);
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.card h3 {
    padding: 10px 10px 0 10px;
    text-align: center;
    font-size: 16px;
}

.card p {
    padding: 4px 10px;
    font-size: 12px;
    text-align: center;
    color: #333;
}

.schedule {
    font-size: 12px;
    text-align: center;
    color: #444;
    padding-bottom: 12px;
    font-weight: 500;
}

footer {
    position: relative;
    margin-left: 220px;
    padding: 18px;
    background: #000;
    color: #f4c300;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
}

body {
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)),
    url('https://images.unsplash.com/photo-1493238792000-8113da705763?q=80&w=1600&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    min-height: 100vh;
    color: white;
    display: flex;
    flex-direction: column;
}

.form-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
    flex: 1;
}

.form-container {
    width: 850px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

.form-container h2 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 500;
    letter-spacing: 1px;
}

.form-grid {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 40px;
}

.profile-section {
    text-align: center;
}

.profile-pic {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 5px solid #ffe100;
    overflow: hidden;
    margin: 0 auto 15px;
    background: #222;
}

.profile-pic img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.upload-btn input {
    display: none;
}

.upload-btn label {
    background: #ffe100;
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    color: black;
    font-weight: bold;
    transition: 0.3s;
}

.upload-btn label:hover {
    background: white;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    font-size: 14px;
    margin-bottom: 5px;
    display: block;
}

.form-group input, select {
    width: 100%;
    padding: 10px 15px;
    border-radius: 25px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.15);
    color: black;
}

.form-group input::placeholder {
    color: #ccc;
}

}
</style>
</head>

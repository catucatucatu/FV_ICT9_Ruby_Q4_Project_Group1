<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
}

.bg {
    position: fixed;
    top: 0;
    left: 220px;
    width: calc(100% - 220px);
    height: 100%;
    background: url('https://upload.wikimedia.org/wikipedia/commons/7/7b/400_Year_old_Beauty.jpg') no-repeat center/cover;
    filter: blur(6px);
    transform: scale(1.05);
    z-index: -1;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 220px;
    height: 100%;
    background: #000;
    color: #f4c300;
    padding-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.sidebar h2 {
    margin-bottom: 15px;
    color: #f4c300;
    text-align: center;
    width: 100%;
}

.sidebar img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #f4c300;
    margin-bottom: 15px;
}

.sidebar a {
    width: 100%;
    display: block;
    color: white;
    text-decoration: none;
    padding: 14px 20px;
    transition: 0.2s;
    text-align: center;
    font-size: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
}

.sidebar a:last-child {
    border-bottom: none;
}

.sidebar a:hover {
    background: #f4c300;
    color: black;
}

.main {
    margin-left: 220px;
    padding: 30px;
    min-height: 100vh;
}

.title {
    color: #fff;
    margin-bottom: 25px;
    font-size: 26px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
}

.card {
    background: rgba(255,255,255,0.92);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    transition: 0.3s;
    cursor: pointer;
    min-height: 240px;
}

.card:hover {
    transform: translateY(-6px);
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.card h3 {
    padding: 10px 10px 0 10px;
    text-align: center;
    font-size: 16px;
}

.card p {
    padding: 4px 10px;
    font-size: 12px;
    text-align: center;
    color: #333;
}

.schedule {
    font-size: 12px;
    text-align: center;
    color: #444;
    padding-bottom: 12px;
    font-weight: 500;
}

footer {
    position: relative;
    margin-left: 220px;
    padding: 18px;
    background: #000;
    color: #f4c300;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
}

.clear{
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
}


</style>
</head>

<div class="bg"></div>

</div>

                    My Tasks
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-6">
                <div class="card">
                    <img src="https://www.ust.edu.ph/wp-content/uploads/2025/10/BS-Chemistry_azure-blue-copy.jpg">
                    <h3><b>I.C.T. Project</b></h3>

            <div class="col-lg-6">

        </div>
        <br>
        <div class="row">
            <div class="col-lg-6">
                <div class="card">

        </div>
    </div>
    </div>
</div>

<script>
function logout(event) {
    event.preventDefault();
    let confirmLogout = confirm("Are you sure you want to logout?");
    if (confirmLogout) {
        window.location.href = "index.html";
    }
}

function buttonclick(bttn){
            var message = "";

            switch(bttn){
            case "1":
                message = "You have already submitted a file for this submission.";
                break;
            case "2":
                message = "The assigned activity has already been closed.";
                break;
            case "3":
                message = "The post has already been deleted.";
                break;
            default: 
                message = "Error... Please try again later."
            }
            alert(message)
        }

</script>
